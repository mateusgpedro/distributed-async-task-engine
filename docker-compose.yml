services:
  postgres:
    image: "postgres:15-alpine"
    environment:
      - POSTGRES_PASSWORD=${PGPASSWORD:-postgres_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: "redis:7-alpine"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  client:
    build:
      dockerfile: Dockerfile
      context: ./client
    mem_limit: 128m
    hostname: client

  api:
    build:
      dockerfile: Dockerfile
      context: ./server
    mem_limit: 128m
    hostname: api
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PGUSER=${PGUSER:-postgres}
      - PGHOST=${PGHOST:-postgres}
      - PGDATABASE=${PGDATABASE:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres_password}
      - PGPORT=${PGPORT:-5432}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      dockerfile: Dockerfile
      context: ./worker
    mem_limit: 128m
    hostname: worker
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    build:
      dockerfile: Dockerfile
      context: ./nginx
    mem_limit: 128m
    hostname: nginx
    ports:
      - "3050:80"
    depends_on:
      - api
      - client
